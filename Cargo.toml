[package]
name = "cargo-unikernel"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
authors = ["Hacer-Bark <hacer.bark@proton.me>"]
license = "0BSD"
description = "Turn a Rust project, another language's static build, or a pre-built binary into a minimal, hardened bootable unikernel image — ISO, cpio+kernel, UKI, with an optional AMD SEV-SNP confidential-computing profile."
repository = "https://github.com/hacer-bark/cargo-unikernel"
homepage = "https://github.com/hacer-bark/cargo-unikernel"
documentation = "https://docs.rs/cargo-unikernel"
readme = "README.md"
keywords = ["unikernel", "sev-snp", "os", "kernel", "hardening"]
categories = ["command-line-utilities", "virtualization"]

[[bin]]
name = "cargo-unikernel"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.11"
include_dir = "0.7"

[lints.rust]
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"

[lints.rustdoc]
all = "deny"
broken_intra_doc_links = "deny"
