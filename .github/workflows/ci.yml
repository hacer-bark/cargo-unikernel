name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: fmt / clippy / msrv / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: rustfmt (host)
        run: cargo fmt --all --check
      - name: rustfmt (guest)
        working-directory: guest
        run: cargo fmt --all --check
      - name: cargo-audit (host)
        run: cargo audit
      - name: cargo-audit (guest)
        working-directory: guest
        run: cargo audit
      - name: clippy (host)
        run: cargo clippy --locked --workspace --all-targets
      - name: clippy (guest, default features)
        working-directory: guest
        run: cargo clippy --locked --workspace --all-targets
      - name: clippy (guest, all features)
        working-directory: guest
        run: cargo clippy --locked --workspace --all-targets --all-features
      - name: clippy (guest, musl target — what actually ships)
        working-directory: guest
        run: cargo clippy --locked --workspace --all-targets --all-features --target x86_64-unknown-linux-musl
      - uses: dtolnay/rust-toolchain@1.88
      - name: msrv (1.88)
        run: cargo +1.88 check --locked

  test:
    name: "test (${{ matrix.name }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: host crate
            dir: .
          - name: guest workspace (default features)
            dir: guest
          - name: guest workspace (all features)
            dir: guest
            flags: --all-features
          - name: guest workspace (sev-snp confidential-computing profile)
            dir: guest
            flags: --no-default-features --features sev-snp,attestation,net-ipv4
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: ${{ matrix.name }}
          workspaces: ${{ matrix.dir }}
      - name: test
        working-directory: ${{ matrix.dir }}
        run: cargo test --locked ${{ matrix.flags }}

  guest-musl:
    name: guest workspace (musl build — the shipped target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          workspaces: guest
      - name: build
        working-directory: guest
        run: cargo build --locked --workspace --all-features --target x86_64-unknown-linux-musl

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - run: cargo doc --locked --no-deps
